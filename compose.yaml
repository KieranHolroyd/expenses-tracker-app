services:
  ledgerly:
    image: ${LEDGERLY_IMAGE:-ghcr.io/kieranholroyd/expenses-tracker-app:latest}
    pull_policy: always
    init: true
    restart: unless-stopped
    ports:
      - '${LEDGERLY_BIND_ADDRESS:-127.0.0.1}:${LEDGERLY_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      LEDGERLY_DATA_DIR: /data
      ORIGIN: ${ORIGIN:?Set ORIGIN to the public URL, for example https://expenses.example.com}
    volumes:
      - ledgerly-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  ledgerly-data:
